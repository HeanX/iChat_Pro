<div id="general-settings-root" class="telegram-general">
  <style>
    .telegram-general {
      --tg-blue: #3390ec;
      --tg-card: #fff;
      --tg-panel: #f4f4f5;
      --tg-muted: #707579;
      --tg-line: rgba(0, 0, 0, .07);
      min-height: 100%;
      padding: 14px 18px 22px;
      background: var(--tg-panel);
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .telegram-general .general-card {
      margin-bottom: 14px;
      padding: 20px 22px 18px;
      border-radius: 24px;
      background: var(--tg-card);
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.06);
    }

    .telegram-general .general-section-title {
      margin: 0 0 16px;
      color: var(--tg-blue);
      font-size: 18px;
      font-weight: 700;
    }

    .telegram-general .general-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 46px;
      gap: 12px;
      color: #111827;
      font-size: 17px;
      line-height: 1.2;
    }

    .telegram-general .general-row.compact {
      grid-template-columns: minmax(0, 1fr) auto;
      min-height: 42px;
    }

    .telegram-general .general-row + .general-row {
      border-top: 1px solid var(--tg-line);
    }

    .telegram-general button.general-row {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .telegram-general .general-icon {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      color: var(--tg-muted);
    }

    .telegram-general .general-icon svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    .telegram-general .general-value {
      color: var(--tg-muted);
      font-size: 17px;
    }

    .telegram-general .general-range {
      width: 100%;
      margin: 10px 0 18px;
      accent-color: var(--tg-blue);
    }

    .telegram-general .wallpaper-strip {
      display: flex;
      flex-direction: row;
      gap: 16px;
      margin: 12px 0 20px;
      overflow-x: auto;
      padding: 6px 6px 12px;
      scrollbar-width: none; /* Hide scrollbar for standard browsers */
      -webkit-overflow-scrolling: touch;
    }

    .telegram-general .wallpaper-strip::-webkit-scrollbar {
      display: none; /* Hide scrollbar for Chrome/Safari */
    }

    .telegram-general .wallpaper-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 72px;
      flex-shrink: 0;
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 10px 8px;
      box-sizing: border-box;
      background: transparent;
      cursor: pointer;
      position: relative;
      outline: none;
      transition: border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .telegram-general .wallpaper-pill-top {
      width: 44px;
      height: 18px;
      border-radius: 9999px;
      align-self: flex-end;
      position: relative;
      z-index: 2;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .telegram-general .wallpaper-pill-bottom {
      width: 44px;
      height: 18px;
      border-radius: 9999px;
      align-self: flex-start;
      margin-top: -8px;
      position: relative;
      z-index: 1;
      background: var(--bubble-incoming, #eef0f2);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
    }

    .telegram-general .wallpaper-emoji {
      margin-top: 10px;
      font-size: 22px;
      line-height: 1.2;
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Colors for top pills in light theme */
    .telegram-general .wallpaper-item[data-wallpaper="default"] .wallpaper-pill-top {
      background: #deecf9;
    }
    .telegram-general .wallpaper-item[data-wallpaper="blue"] .wallpaper-pill-top {
      background: #d7ebff;
    }
    .telegram-general .wallpaper-item[data-wallpaper="green"] .wallpaper-pill-top {
      background: #d4e6c9;
    }
    .telegram-general .wallpaper-item[data-wallpaper="pink"] .wallpaper-pill-top {
      background: #fce7f3;
    }
    .telegram-general .wallpaper-item[data-wallpaper="purple"] .wallpaper-pill-top {
      background: #ebdcf9;
    }
    .telegram-general .wallpaper-item[data-wallpaper="orange"] .wallpaper-pill-top {
      background: #ffedd5;
    }
    .telegram-general .wallpaper-item[data-wallpaper="cyan"] .wallpaper-pill-top {
      background: #e0f7fa;
    }
    .telegram-general .wallpaper-item[data-wallpaper="yellow"] .wallpaper-pill-top {
      background: #fef9c3;
    }

    .telegram-general {
      --bubble-incoming: #eef0f2;
    }

    /* Selected state */
    .telegram-general .wallpaper-item.is-selected {
      border-color: var(--color-primary, var(--tg-blue, #3390ec));
    }
    
    /* Interactive states */
    .telegram-general .wallpaper-item:hover {
      background: rgba(0, 0, 0, 0.03);
    }
    [data-theme="dark"] .telegram-general .wallpaper-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .telegram-general .wallpaper-item:hover .wallpaper-emoji {
      transform: scale(1.15);
    }
    .telegram-general .wallpaper-item:active {
      transform: scale(0.96);
    }

    .telegram-general .general-option {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      width: 100%;
      min-height: 46px;
      gap: 12px;
      border: 0;
      background: transparent;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .telegram-general .telegram-radio {
      position: relative;
      width: 22px;
      height: 22px;
      border: 2px solid #b1b5b9;
      border-radius: 50%;
      box-sizing: border-box;
      display: inline-block;
      flex-shrink: 0;
      transition: border-color 0.16s ease;
    }

    .telegram-general .telegram-radio::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--tg-blue, #3390ec);
      transition: transform 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .telegram-general .general-option.is-selected .telegram-radio {
      border-color: var(--tg-blue);
    }

    .telegram-general .general-option.is-selected .telegram-radio::after {
      transform: translate(-50%, -50%) scale(1);
    }

    .telegram-general .general-option-title {
      display: block;
      color: #111827;
      font-size: 17px;
      line-height: 1.2;
    }

    .telegram-general .general-option-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--tg-muted);
      font-size: 13px;
      line-height: 1.2;
    }

    .telegram-general .general-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 120;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(17, 24, 39, .9);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .telegram-general .general-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Dark Mode Settings */
    [data-theme="dark"] .telegram-general {
      --tg-card: #212121;
      --tg-panel: #181818;
      --tg-muted: #aaaaaa;
      --tg-line: rgba(255, 255, 255, .08);
      color: #f1f5f9;
    }

    [data-theme="dark"] .telegram-general .general-row,
    [data-theme="dark"] .telegram-general .general-option-title,
    [data-theme="dark"] .telegram-general .general-value {
      color: #f1f5f9;
    }

    [data-theme="dark"] .telegram-general .telegram-radio {
      border-color: #555555;
    }

    [data-theme="dark"] .telegram-general .general-option.is-selected .telegram-radio {
      border-color: var(--tg-blue);
    }

    [data-theme="dark"] .telegram-general {
      --bubble-incoming: #2c2c2e;
    }
    [data-theme="dark"] .telegram-general .wallpaper-item[data-wallpaper="default"] .wallpaper-pill-top {
      background: #2b3036;
    }
    [data-theme="dark"] .telegram-general .wallpaper-item[data-wallpaper="blue"] .wallpaper-pill-top {
      background: #1c2536;
    }
    [data-theme="dark"] .telegram-general .wallpaper-item[data-wallpaper="green"] .wallpaper-pill-top {
      background: #1b2a1c;
    }
    [data-theme="dark"] .telegram-general .wallpaper-item[data-wallpaper="pink"] .wallpaper-pill-top {
      background: #2d1c25;
    }
    [data-theme="dark"] .telegram-general .wallpaper-item[data-wallpaper="purple"] .wallpaper-pill-top {
      background: #231c2d;
    }
    [data-theme="dark"] .telegram-general .wallpaper-item[data-wallpaper="orange"] .wallpaper-pill-top {
      background: #2d221c;
    }
    [data-theme="dark"] .telegram-general .wallpaper-item[data-wallpaper="cyan"] .wallpaper-pill-top {
      background: #1c2d2f;
    }
    [data-theme="dark"] .telegram-general .wallpaper-item[data-wallpaper="yellow"] .wallpaper-pill-top {
      background: #2a281c;
    }
  </style>

  <section class="general-card">
    <h3 class="general-section-title" data-i18n="settings">Settings</h3>
    <div class="general-row compact">
      <span data-i18n="message_font_size">Message Font Size</span>
      <span id="general-font-size-label" class="general-value">16</span>
    </div>
    <input id="general-font-size-range" class="general-range" type="range" min="12" max="24" value="16" step="1">
    <button type="button" class="general-row" data-action="wallpaper">
      <span class="general-icon"><i data-lucide="image"></i></span>
      <span data-i18n="chat_wallpaper">Chat Wallpaper</span>
      <i data-lucide="chevron-right" style="color: var(--tg-muted);"></i>
    </button>
    <button type="button" class="general-row" data-action="power-saving">
      <span class="general-icon"><i data-lucide="gauge"></i></span>
      <span data-i18n="power_saving_mode">Power Saving Mode</span>
      <span id="general-power-label" class="general-value">Disabled</span>
    </button>
  </section>

  <section class="general-card">
    <h3 class="general-section-title" data-i18n="theme_color">Theme Color</h3>
    <div class="wallpaper-strip">
      <button type="button" class="wallpaper-item" data-wallpaper="default" aria-label="Default wallpaper">
        <div class="wallpaper-pill-top"></div>
        <div class="wallpaper-pill-bottom"></div>
        <span class="wallpaper-emoji">⛄</span>
      </button>
      <button type="button" class="wallpaper-item" data-wallpaper="blue" aria-label="Blue wallpaper">
        <div class="wallpaper-pill-top"></div>
        <div class="wallpaper-pill-bottom"></div>
        <span class="wallpaper-emoji">💎</span>
      </button>
      <button type="button" class="wallpaper-item" data-wallpaper="green" aria-label="Green wallpaper">
        <div class="wallpaper-pill-top"></div>
        <div class="wallpaper-pill-bottom"></div>
        <span class="wallpaper-emoji">👨‍🏫</span>
      </button>
      <button type="button" class="wallpaper-item" data-wallpaper="pink" aria-label="Pink wallpaper">
        <div class="wallpaper-pill-top"></div>
        <div class="wallpaper-pill-bottom"></div>
        <span class="wallpaper-emoji">🌷</span>
      </button>
      <button type="button" class="wallpaper-item" data-wallpaper="purple" aria-label="Purple wallpaper">
        <div class="wallpaper-pill-top"></div>
        <div class="wallpaper-pill-bottom"></div>
        <span class="wallpaper-emoji">💜</span>
      </button>
      <button type="button" class="wallpaper-item" data-wallpaper="orange" aria-label="Orange wallpaper">
        <div class="wallpaper-pill-top"></div>
        <div class="wallpaper-pill-bottom"></div>
        <span class="wallpaper-emoji">🍁</span>
      </button>
      <button type="button" class="wallpaper-item" data-wallpaper="cyan" aria-label="Cyan wallpaper">
        <div class="wallpaper-pill-top"></div>
        <div class="wallpaper-pill-bottom"></div>
        <span class="wallpaper-emoji">🌐</span>
      </button>
      <button type="button" class="wallpaper-item" data-wallpaper="yellow" aria-label="Yellow wallpaper">
        <div class="wallpaper-pill-top"></div>
        <div class="wallpaper-pill-bottom"></div>
        <span class="wallpaper-emoji">🌻</span>
      </button>
    </div>
    <button type="button" class="general-option" data-theme="light">
      <span class="telegram-radio"></span>
      <span class="general-option-title" data-i18n="light_theme">Light</span>
    </button>
    <button type="button" class="general-option" data-theme="dark">
      <span class="telegram-radio"></span>
      <span class="general-option-title" data-i18n="dark_theme_night">Dark / Night</span>
    </button>
    <button type="button" class="general-option" data-theme="system">
      <span class="telegram-radio"></span>
      <span class="general-option-title" data-i18n="system_default">System Default</span>
    </button>
  </section>

  <section class="general-card">
    <h3 class="general-section-title" data-i18n="time_format">Time Format</h3>
    <button type="button" class="general-option" data-time-format="12h">
      <span class="telegram-radio"></span>
      <span>
        <span class="general-option-title" data-i18n="hour_12">12-Hour</span>
        <span class="general-option-subtitle">04:39 PM</span>
      </span>
    </button>
    <button type="button" class="general-option" data-time-format="24h">
      <span class="telegram-radio"></span>
      <span>
        <span class="general-option-title" data-i18n="hour_24">24-Hour</span>
        <span class="general-option-subtitle">16:39</span>
      </span>
    </button>
  </section>

  <div id="general-toast" class="general-toast"></div>
</div>

<script>
  (function() {
    const GENERAL_SETTINGS_URL = '/api/settings/general/';
    const DEFAULTS = {
      theme: 'system',
      accent_color: 'blue',
      wallpaper: 'default',
      message_font_size: '16',
      time_format: '24h',
      power_saving: false,
      reduce_motion: false
    };
    const WALLPAPER_COLORS = {
      default: '#deecf9',
      blue: '#d7ebff',
      green: '#d4e6c9',
      pink: '#fce7f3',
      purple: '#ebdcf9',
      orange: '#ffedd5',
      cyan: '#e0f7fa',
      yellow: '#fef9c3'
    };
    const ACCENT_COLORS = {
      blue: '#3390ec',
      green: '#22c55e',
      purple: '#8b5cf6',
      red: '#ef4444',
      orange: '#f97316'
    };
    let toastTimer = null;

    function csrfToken() {
      if (typeof getCookie === 'function') return getCookie('csrftoken') || '';
      const match = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    function toast(text) {
      if (window.showToast) {
        window.showToast(text);
        return;
      }
      const el = document.getElementById('general-toast');
      if (!el) return;
      el.textContent = text;
      el.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.classList.remove('is-visible'); }, 1800);
    }

    function loadGeneralSettings() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('ichat_general') || '{}'); } catch (error) {}
      return Object.assign({}, DEFAULTS, saved);
    }

    function saveGeneralSettings(partial) {
      const settings = Object.assign({}, loadGeneralSettings(), partial || {});
      localStorage.setItem('ichat_general', JSON.stringify(settings));
      applyGeneralSettingsUI(settings);
      fetch(GENERAL_SETTINGS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken(),
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify(partial || settings)
      }).then(function(response) {
        if (!response.ok) throw new Error('save_failed');
        return response.json();
      }).then(function(data) {
        if (data.settings) {
          localStorage.setItem('ichat_general', JSON.stringify(data.settings));
          applyGeneralSettingsUI(data.settings);
        }
      }).catch(function() {
        toast('保存失败');
      });
      return settings;
    }

    async function loadGeneralSettingsFromServer() {
      const response = await fetch(GENERAL_SETTINGS_URL, {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      if (!response.ok) throw new Error('load_failed');
      const data = await response.json();
      const settings = Object.assign({}, DEFAULTS, data.settings || {});
      localStorage.setItem('ichat_general', JSON.stringify(settings));
      applyGeneralSettingsUI(settings);
      return settings;
    }

    function effectiveTheme(theme) {
      if (theme === 'dark' || theme === 'night') return 'dark';
      if (theme === 'system') {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      return 'light';
    }

    function applyThemeGlobally(theme) {
      const applied = effectiveTheme(theme);
      document.documentElement.setAttribute('data-theme', applied);
      document.documentElement.classList.toggle('dark', applied === 'dark');
      localStorage.setItem('ichat-theme', applied);
    }

    function hexToRgba(hex, alpha) {
      if (!hex || hex.indexOf('#') !== 0) return '';
      const clean = hex.replace('#', '');
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function applyWallpaper(settings) {
      const wallpaper = settings.wallpaper || 'default';
      document.documentElement.setAttribute('data-wallpaper', wallpaper);
      
      let color = WALLPAPER_COLORS[wallpaper] || '';
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      
      if (isDark && color) {
        const darkWallpapers = {
          '#deecf9': '#0f1218', // Default
          '#d7ebff': '#1c2536', // Blue
          '#d4e6c9': '#1b2a1c', // Green
          '#fce7f3': '#2d1c25', // Pink
          '#ebdcf9': '#231c2d', // Purple
          '#ffedd5': '#2d221c', // Orange
          '#e0f7fa': '#1c2d2f', // Cyan
          '#fef9c3': '#2a281c'  // Yellow
        };
        color = darkWallpapers[color] || color;
      }

      const layout = document.querySelector('.chat-layout');
      if (layout) layout.style.backgroundColor = color;
      if (color) {
        document.documentElement.style.setProperty('--chat-layout-bg', color);
        document.documentElement.style.setProperty('--chat-footer-bg', color);
        document.documentElement.style.setProperty('--chat-footer-bg-rgba', hexToRgba(color, .88));
      } else {
        document.documentElement.style.removeProperty('--chat-layout-bg');
        document.documentElement.style.removeProperty('--chat-footer-bg');
        document.documentElement.style.removeProperty('--chat-footer-bg-rgba');
      }
    }

    function applyGeneralSettingsUI(settings) {
      const sizeRange = document.getElementById('general-font-size-range');
      const sizeLabel = document.getElementById('general-font-size-label');
      if (sizeRange) sizeRange.value = settings.message_font_size;
      if (sizeLabel) sizeLabel.textContent = settings.message_font_size;

      document.querySelectorAll('#general-settings-root [data-theme]').forEach(function(button) {
        button.classList.toggle('is-selected', button.dataset.theme === settings.theme);
      });
      document.querySelectorAll('#general-settings-root [data-time-format]').forEach(function(button) {
        button.classList.toggle('is-selected', button.dataset.timeFormat === settings.time_format);
      });
      document.querySelectorAll('#general-settings-root [data-wallpaper]').forEach(function(button) {
        button.classList.toggle('is-selected', button.dataset.wallpaper === settings.wallpaper);
      });

      const powerLabel = document.getElementById('general-power-label');
      if (powerLabel) powerLabel.textContent = settings.power_saving ? '已启用' : '已停用';

      document.documentElement.style.setProperty('--color-primary', ACCENT_COLORS[settings.accent_color] || '#3390ec');
      document.documentElement.style.setProperty('--message-font-size', settings.message_font_size + 'px');
      applyThemeGlobally(settings.theme);
      applyWallpaper(settings);
      if (window.lucide) window.lucide.createIcons();
    }

    function bindGeneralSettings() {
      const root = document.getElementById('general-settings-root');
      if (!root || root.dataset.bound === 'true') return;
      root.dataset.bound = 'true';

      document.getElementById('general-font-size-range')?.addEventListener('input', function(event) {
        saveGeneralSettings({ message_font_size: String(event.target.value) });
      });

      root.addEventListener('click', function(event) {
        const themeButton = event.target.closest('button[data-theme]');
        if (themeButton) {
          saveGeneralSettings({ theme: themeButton.dataset.theme });
          toast('主题已更新');
          return;
        }
        const timeButton = event.target.closest('button[data-time-format]');
        if (timeButton) {
          saveGeneralSettings({ time_format: timeButton.dataset.timeFormat });
          toast(timeButton.dataset.timeFormat === '12h' ? '12小时制' : '24小时制');
          if (window.renderChatList) window.renderChatList();
          if (window.renderMessages) window.renderMessages();
          if (window.activeChatId && window.conversationsById && window.conversationsById[window.activeChatId] && window.updateHeaderPresence) {
            window.updateHeaderPresence(window.conversationsById[window.activeChatId]);
          }
          return;
        }
        const wallpaperButton = event.target.closest('button[data-wallpaper]');
        if (wallpaperButton) {
          saveGeneralSettings({ wallpaper: wallpaperButton.dataset.wallpaper });
          toast('聊天壁纸已更新');
          return;
        }
        const action = event.target.closest('button[data-action]')?.dataset.action;
        if (action === 'power-saving') {
          const current = loadGeneralSettings();
          saveGeneralSettings({ power_saving: !current.power_saving, reduce_motion: !current.power_saving });
          toast(!current.power_saving ? '省电模式已启用' : '省电模式已停用');
        }
        if (action === 'wallpaper') {
          toast('请选择下方壁纸预览');
        }
      });
    }

    window.refreshGeneralSettings = function() {
      bindGeneralSettings();
      applyGeneralSettingsUI(loadGeneralSettings());
      loadGeneralSettingsFromServer().catch(function() {});
    };

    bindGeneralSettings();
    applyGeneralSettingsUI(loadGeneralSettings());
    loadGeneralSettingsFromServer().catch(function() {});
  })();
</script>
