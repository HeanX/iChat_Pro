<!-- Reusable Chat List Item Component for iChat Pro -->
<div id="chat-item-wrapper-{{ chat_id }}" class="w-full">
  <button id="chat-item-{{ chat_id }}" onclick="selectChat('{{ chat_id }}')"
    class="chat-item-btn telegram-chat-item w-full text-left focus:outline-none relative group select-none">
    
    <!-- Left: Avatar Area -->
    <div class="telegram-chat-avatar-wrap relative">
      <div class="telegram-chat-avatar {{ chat_avatar_bg }}">
        {{ chat_avatar }}
      </div>
      <!-- Presence Indicator -->
      {% if is_online %}
      <span class="absolute bottom-0 right-0 block h-3.5 w-3.5 rounded-full bg-green-500 border-2 border-bgSidebar" title="Online"></span>
      {% endif %}
    </div>

    <!-- Center: Content Area -->
    <div class="telegram-chat-content">
      <div class="telegram-chat-topline">
        <h3 class="telegram-chat-title">
          <span>{{ chat_name }}</span>
          {% if is_encrypted %}
          <i data-lucide="lock" class="w-3.5 h-3.5 text-brand-light dark:text-brand-dark inline-block flex-shrink-0" title="End-to-End Encrypted"></i>
          {% endif %}
        </h3>
        <span id="chat-time-{{ chat_id }}" class="chat-item-time telegram-chat-time">{{ last_message_time }}</span>
      </div>
      
      <div class="telegram-chat-bottomline">
        <p id="last-msg-{{ chat_id }}" class="telegram-chat-preview">
          {{ last_message }}
        </p>
        
        <!-- Unread badge -->
        <span id="unread-badge-{{ chat_id }}" 
          class="{% if not unread_count or unread_count == '0' %}hidden{% endif %} unread-badge telegram-chat-unread">
          {{ unread_count }}
        </span>
      </div>
    </div>
  </button>
</div>
