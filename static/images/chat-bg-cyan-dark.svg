<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Cyan Tech E2EE Theme Pattern (Dark Mode) -->
    <pattern id="doodlePattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.035">
        <!-- Lock -->
        <rect x="15" y="15" width="10" height="8" rx="1.5" />
        <path d="M 17,15 v -3 a3,3 0 0 1 6,0 v 3" />
        
        <!-- Key -->
        <circle cx="75" cy="20" r="3" />
        <path d="M 78,20 h 8 M 82,20 v 3 M 85,20 v 3" />
        
        <!-- Shield -->
        <path d="M 45,15 h 10 v 5 c 0,3 -5,5 -5,5 c 0,0 -5,-2 -5,-5 z" />
        
        <!-- Coding Brackets -->
        <path d="M 10,55 L 5,60 L 10,65 M 20,55 L 25,60 L 20,65" />
        
        <!-- Laptop -->
        <rect x="95" y="55" width="14" height="9" rx="1" />
        <line x1="92" y1="64" x2="112" y2="64" />
        
        <!-- Network Nodes -->
        <path d="M 15,90 L 25,95 L 35,90 L 30,100 Z" />
        <circle cx="15" cy="90" r="1" fill="#ffffff" />
        <circle cx="25" cy="95" r="1" fill="#ffffff" />
        <circle cx="35" cy="90" r="1" fill="#ffffff" />
        <circle cx="30" cy="100" r="1" fill="#ffffff" />

        <!-- Speech Bubble with Keyhole -->
        <path d="M 70,95 h 14 a2,2 0 0 1 2,2 v 6 a2,2 0 0 1 -2,2 h -9 l -5,3 v -3 a2,2 0 0 1 -2,-2 v -6 a2,2 0 0 1 2,-2 Z" />
        <circle cx="77" cy="100" r="1" fill="#ffffff" />
        <line x1="77" y1="101" x2="77" y2="103" />

        <!-- Gear -->
        <circle cx="105" cy="95" r="3" />
        <path d="M 105,90 v 2 M 105,98 v 2 M 100,95 h 2 M 108,95 h 2" />

        <!-- Sparkles -->
        <circle cx="65" cy="50" r="1" fill="#ffffff" opacity="0.5" />
        <circle cx="115" cy="35" r="1" fill="#ffffff" opacity="0.5" />
        <circle cx="5" cy="35" r="1" fill="#ffffff" opacity="0.5" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#doodlePattern)" />
</svg>
