<div id="chat-folders-root" class="telegram-folders">
  <style>
    .telegram-folders {
      --tg-blue: #3390ec;
      --tg-card: #fff;
      --tg-panel: #f4f4f5;
      --tg-muted: #707579;
      --tg-line: rgba(0, 0, 0, .07);
      min-height: 100%;
      padding: 14px 18px 22px;
      background: var(--tg-panel);
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .telegram-folders .folders-hero {
      display: grid;
      justify-items: center;
      padding: 18px 12px 16px;
      text-align: center;
    }

    .telegram-folders .folder-illustration {
      position: relative;
      width: 92px;
      height: 82px;
      margin-bottom: 18px;
    }

    .telegram-folders .folder-illustration::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 22px;
      width: 72px;
      height: 48px;
      border: 2px solid #b77d40;
      border-radius: 7px;
      background: linear-gradient(#e9b873, #d69a55);
      box-shadow: inset 0 2px rgba(255,255,255,.45);
    }

    .telegram-folders .folder-illustration::after {
      content: "";
      position: absolute;
      left: 15px;
      top: 15px;
      width: 56px;
      height: 18px;
      border-radius: 6px 6px 0 0;
      background:
        linear-gradient(90deg, #f08d33 0 24px, #536df4 24px 40px, #ef3f4a 40px);
      border: 2px solid #b77d40;
      border-bottom: 0;
    }

    .telegram-folders .folders-description {
      margin: 0 0 18px;
      color: var(--tg-muted);
      font-size: 16px;
      line-height: 1.35;
    }

    .telegram-folders .folders-create {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      background: var(--tg-blue);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(51, 144, 236, .25);
    }

    .telegram-folders .folders-card {
      margin-bottom: 14px;
      padding: 20px 22px 18px;
      border-radius: 24px;
      background: var(--tg-card);
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.06);
    }

    .telegram-folders .folders-section-title {
      margin: 0 0 16px;
      color: var(--tg-blue);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .telegram-folders .folder-item,
    .telegram-folders .folder-option {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      min-height: 46px;
      gap: 12px;
      border: 0;
      background: transparent;
      text-align: left;
      font: inherit;
    }

    .telegram-folders .folder-item + .folder-item,
    .telegram-folders .folder-option + .folder-option {
      border-top: 1px solid var(--tg-line);
    }

    .telegram-folders .folder-icon {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      color: var(--tg-muted);
    }

    .telegram-folders .folder-icon svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    .telegram-folders .folder-title {
      display: block;
      overflow: hidden;
      color: #111827;
      font-size: 17px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .telegram-folders .folder-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--tg-muted);
      font-size: 13px;
      line-height: 1.2;
    }

    .telegram-folders .folder-action {
      border: 0;
      background: transparent;
      color: var(--tg-muted);
      cursor: pointer;
    }

    .telegram-folders .folder-option {
      grid-template-columns: 42px minmax(0, 1fr);
      cursor: pointer;
    }

    .telegram-folders .telegram-radio {
      position: relative;
      width: 22px;
      height: 22px;
      border: 2px solid #b1b5b9;
      border-radius: 50%;
      box-sizing: border-box;
      display: inline-block;
      flex-shrink: 0;
      transition: border-color 0.16s ease;
    }

    .telegram-folders .telegram-radio::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--tg-blue, #3390ec);
      transition: transform 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .telegram-folders .folder-option.is-selected .telegram-radio {
      border-color: var(--tg-blue);
    }

    .telegram-folders .folder-option.is-selected .telegram-radio::after {
      transform: translate(-50%, -50%) scale(1);
    }

    .telegram-folders .folder-empty {
      padding: 10px 0 2px;
      color: var(--tg-muted);
      font-size: 15px;
    }

    .telegram-folders .folders-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 120;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(17, 24, 39, .9);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .telegram-folders .folders-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Dark Mode Settings */
    [data-theme="dark"] .telegram-folders {
      --tg-card: #212121;
      --tg-panel: #181818;
      --tg-muted: #aaaaaa;
      --tg-line: rgba(255, 255, 255, .08);
      color: #f1f5f9;
    }

    [data-theme="dark"] .telegram-folders .folder-title,
    [data-theme="dark"] .telegram-folders .folder-item,
    [data-theme="dark"] .telegram-folders .folder-option {
      color: #f1f5f9;
    }

    [data-theme="dark"] .telegram-folders .telegram-radio {
      border-color: #555555;
    }

    [data-theme="dark"] .telegram-folders .folder-option.is-selected .telegram-radio {
      border-color: var(--tg-blue);
    }
  </style>

  <section class="folders-hero">
    <div class="folder-illustration" aria-hidden="true"></div>
    <p class="folders-description" data-i18n="folders">Create folders for different groups of chats to easily access them.</p>
    <button type="button" id="folder-create-btn" class="folders-create">
      <i data-lucide="plus"></i>
      <span data-i18n="create_folder">Create Folder</span>
    </button>
  </section>

  <section class="folders-card">
    <h3 class="folders-section-title" data-i18n="folders">Folders</h3>
    <div id="folders-list"></div>
  </section>

  <section class="folders-card">
    <h3 class="folders-section-title" data-i18n="folders_view">Folders View</h3>
    <button type="button" class="folder-option" data-folder-view="sidebar">
      <span class="telegram-radio"></span>
      <span class="folder-title" data-i18n="folders_sidebar">Left Sidebar</span>
    </button>
    <button type="button" class="folder-option" data-folder-view="above">
      <span class="telegram-radio"></span>
      <span class="folder-title" data-i18n="folders_above_chats">Folders Above Chats</span>
    </button>
  </section>

  <div id="folders-toast" class="folders-toast"></div>
</div>

<script nonce="{{ request.csp_nonce }}">
  (function() {
    const FOLDER_SETTINGS_URL = '/api/settings/chat-folders/';
    const DEFAULTS = {
      folders: [],
      folders_view: 'above'
    };
    let toastTimer = null;

    function csrfToken() {
      if (typeof getCookie === 'function') return getCookie('csrftoken') || '';
      const match = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    function toast(text) {
      if (window.showToast) {
        window.showToast(text);
        return;
      }
      const el = document.getElementById('folders-toast');
      if (!el) return;
      el.textContent = text;
      el.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.classList.remove('is-visible'); }, 1800);
    }

    function loadFolderSettings() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('ichat_folders') || '{}'); } catch (error) {}
      const settings = Object.assign({}, DEFAULTS, saved);
      if (!Array.isArray(settings.folders)) settings.folders = [];
      if (settings.folders_view === true) settings.folders_view = 'above';
      if (settings.folders_view === false) settings.folders_view = 'sidebar';
      return settings;
    }

    function saveFolderSettings(partial) {
      const settings = Object.assign({}, loadFolderSettings(), partial || {});
      localStorage.setItem('ichat_folders', JSON.stringify(settings));
      renderFolderSettings(settings);
      fetch(FOLDER_SETTINGS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken(),
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify(partial || settings)
      }).then(function(response) {
        if (!response.ok) throw new Error('save_failed');
        return response.json();
      }).then(function(data) {
        if (data.settings) {
          localStorage.setItem('ichat_folders', JSON.stringify(data.settings));
          renderFolderSettings(data.settings);
        }
      }).catch(function() {
        toast('保存失败');
      });
      return settings;
    }

    async function loadFolderSettingsFromServer() {
      const response = await fetch(FOLDER_SETTINGS_URL, {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      if (!response.ok) throw new Error('load_failed');
      const data = await response.json();
      const settings = Object.assign({}, DEFAULTS, data.settings || {});
      localStorage.setItem('ichat_folders', JSON.stringify(settings));
      renderFolderSettings(settings);
      return settings;
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, function(ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    function renderFoldersList(settings) {
      const list = document.getElementById('folders-list');
      if (!list) return;
      if (!settings.folders.length) {
        list.innerHTML = '<p class="folder-empty">暂无文件夹</p>';
        return;
      }
      list.innerHTML = settings.folders.map(function(folder) {
        return '<div class="folder-item">'
          + '<span class="folder-icon"><i data-lucide="folder"></i></span>'
          + '<span><span class="folder-title">' + escapeHtml(folder.name) + '</span><span class="folder-subtitle">' + (folder.chat_count || 0) + ' chats</span></span>'
          + '<button type="button" class="folder-action" data-folder-delete="' + escapeHtml(folder.id) + '"><i data-lucide="trash-2"></i></button>'
          + '</div>';
      }).join('');
    }

    function applyFolderView(settings) {
      document.querySelectorAll('#chat-folders-root [data-folder-view]').forEach(function(button) {
        button.classList.toggle('is-selected', button.dataset.folderView === settings.folders_view);
      });
      document.documentElement.dataset.folderView = settings.folders_view;
    }

    function renderFolderSettings(settings) {
      renderFoldersList(settings);
      applyFolderView(settings);
      if (window.lucide) window.lucide.createIcons();
    }

    function createFolder() {
      const name = prompt('文件夹名称');
      if (!name) return;
      const trimmed = name.trim();
      if (!trimmed) return;
      const settings = loadFolderSettings();
      settings.folders.push({
        id: String(Date.now()),
        name: trimmed,
        chat_count: 0,
        created_at: new Date().toISOString()
      });
      saveFolderSettings({ folders: settings.folders });
      toast('文件夹已创建');
    }

    function deleteFolder(folderId) {
      const settings = loadFolderSettings();
      saveFolderSettings({
        folders: settings.folders.filter(function(folder) { return String(folder.id) !== String(folderId); })
      });
      toast('文件夹已删除');
    }

    function bindFolderSettings() {
      const root = document.getElementById('chat-folders-root');
      if (!root || root.dataset.bound === 'true') return;
      root.dataset.bound = 'true';

      document.getElementById('folder-create-btn')?.addEventListener('click', createFolder);

      root.addEventListener('click', function(event) {
        const viewButton = event.target.closest('[data-folder-view]');
        if (viewButton) {
          saveFolderSettings({ folders_view: viewButton.dataset.folderView });
          toast('文件夹显示方式已保存');
          return;
        }
        const deleteButton = event.target.closest('[data-folder-delete]');
        if (deleteButton) {
          deleteFolder(deleteButton.dataset.folderDelete);
        }
      });
    }

    window.refreshChatFoldersSettings = function() {
      bindFolderSettings();
      renderFolderSettings(loadFolderSettings());
      loadFolderSettingsFromServer().catch(function() {});
    };

    bindFolderSettings();
    renderFolderSettings(loadFolderSettings());
    loadFolderSettingsFromServer().catch(function() {});
  })();
</script>
