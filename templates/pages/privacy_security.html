<div id="privacy-security-settings" class="telegram-privacy">
  <style>
    .telegram-privacy {
      --tg-blue: #3390ec;
      --tg-card: #fff;
      --tg-panel: #f4f4f5;
      --tg-muted: #707579;
      --tg-line: rgba(0, 0, 0, .07);
      min-height: 100%;
      padding: 14px 18px 22px;
      background: var(--tg-panel);
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .telegram-privacy .privacy-card {
      margin-bottom: 14px;
      padding: 20px 22px 18px;
      border-radius: 24px;
      background: var(--tg-card);
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.06);
    }

    .telegram-privacy .privacy-section-title {
      margin: 0 0 16px;
      color: var(--tg-blue);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .telegram-privacy .privacy-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      min-height: 46px;
      gap: 12px;
      border: 0;
      background: transparent;
      color: #111827;
      text-align: left;
      font: inherit;
      font-size: 17px;
      line-height: 1.2;
      cursor: pointer;
    }

    .telegram-privacy .privacy-row + .privacy-row {
      border-top: 1px solid var(--tg-line);
    }

    .telegram-privacy .privacy-row[data-detail] {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .telegram-privacy .privacy-icon {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      color: var(--tg-muted);
    }

    .telegram-privacy .privacy-icon svg {
      width: 23px;
      height: 23px;
      stroke-width: 2;
    }

    .telegram-privacy .privacy-title {
      display: block;
      overflow: hidden;
      color: #111827;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .telegram-privacy .privacy-subtitle {
      margin-top: 3px;
      color: var(--tg-muted);
      font-size: 13px;
      line-height: 1.22;
    }

    .telegram-privacy .privacy-note {
      margin-top: 3px;
      color: var(--tg-muted);
      font-size: 15px;
      line-height: 1.22;
    }

    .telegram-privacy .privacy-note {
      margin: 12px 22px 22px;
    }

    .telegram-privacy .privacy-chevron {
      color: var(--tg-muted);
    }

    .telegram-privacy .telegram-radio {
      position: relative;
      width: 22px;
      height: 22px;
      border: 2px solid #b1b5b9;
      border-radius: 50%;
      box-sizing: border-box;
      display: inline-block;
      flex-shrink: 0;
      transition: border-color 0.16s ease;
    }

    .telegram-privacy .telegram-radio::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--tg-blue, #3390ec);
      transition: transform 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .telegram-privacy .privacy-option.is-selected {
      border-radius: 16px;
      background: rgba(0, 0, 0, .055);
    }

    .telegram-privacy .privacy-option.is-selected .telegram-radio {
      border-color: var(--tg-blue);
    }

    .telegram-privacy .privacy-option.is-selected .telegram-radio::after {
      transform: translate(-50%, -50%) scale(1);
    }

    .telegram-privacy .privacy-switch {
      position: relative;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: #e9ecef;
      transition: background-color 0.16s ease;
      flex: 0 0 auto;
    }

    .telegram-privacy .privacy-switch::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
      transition: transform 0.16s ease;
    }

    .telegram-privacy .privacy-switch.is-on {
      background: var(--tg-blue);
    }

    .telegram-privacy .privacy-switch.is-on::after {
      transform: translateX(18px);
    }

    .telegram-privacy .privacy-view {
      display: none;
    }

    .telegram-privacy .privacy-view.is-active {
      display: block;
    }

    .telegram-privacy .privacy-detail-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 54px;
      padding: 0 4px 10px;
    }

    .telegram-privacy .privacy-detail-header button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #6f7780;
      cursor: pointer;
    }

    .telegram-privacy .privacy-detail-header h3 {
      margin: 0;
      color: #111;
      font-size: 22px;
      font-weight: 650;
    }

    .telegram-privacy .privacy-danger {
      color: #d44747;
    }

    .telegram-privacy .privacy-danger .privacy-title {
      color: #d44747;
    }

    .telegram-privacy .storage-action {
      border: 0;
      background: transparent;
      color: var(--tg-blue);
      font: inherit;
      cursor: pointer;
    }

    .telegram-privacy .privacy-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 120;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(17, 24, 39, .9);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .telegram-privacy .privacy-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Dark Mode Settings */
    [data-theme="dark"] .telegram-privacy {
      --tg-card: #212121;
      --tg-panel: #181818;
      --tg-muted: #aaaaaa;
      --tg-line: rgba(255, 255, 255, .08);
      color: #f1f5f9;
    }

    [data-theme="dark"] .telegram-privacy .privacy-row,
    [data-theme="dark"] .telegram-privacy .privacy-title,
    [data-theme="dark"] .telegram-privacy .privacy-detail-header h3 {
      color: #f1f5f9;
    }

    [data-theme="dark"] .telegram-privacy .privacy-switch {
      background: #2b2b2b;
    }

    [data-theme="dark"] .telegram-privacy .privacy-switch.is-on {
      background: #3390ec;
    }

    [data-theme="dark"] .telegram-privacy .privacy-option.is-selected {
      background: rgba(255, 255, 255, .055);
    }

    [data-theme="dark"]    .telegram-privacy .privacy-detail-header button {
      color: #aaaaaa;
    }

    [data-theme="dark"] .telegram-privacy .telegram-radio {
      border-color: #555555;
    }

    [data-theme="dark"] .telegram-privacy .privacy-option.is-selected .telegram-radio {
      border-color: var(--tg-blue);
    }
  </style>

<script>
  (function() {
    const SETTINGS_URL = '/api/privacy/settings/';
    const BLOCKED_URL = '/api/privacy/blocked/';
    const UNBLOCK_URL = '/api/privacy/unblock/';
    const DELETE_ACCOUNT_URL = '/api/privacy/delete-account/';
    let privacySettings = {};
    let detailField = null;
    let toastTimer = null;

    const DETAIL_CONFIG = {
      last_seen_visibility: {
        title: '最后上线时间',
        question: '谁可以看到您最后上线的时间?',
        help: '注意：如果对方没有和你分享他们的最近在线时间，则你只能看到大致的时间段，如最近，一周内，一个月内等。',
        options: ['everyone', 'contacts', 'nobody'],
        exception: '从不分享给'
      },
      phone_number_visibility: { title: '手机号码', question: '谁可以看见我的手机号码?', options: ['everyone', 'contacts', 'nobody'], exception: '从不分享给' },
      profile_photo_visibility: { title: '头像', question: '谁能看见我的头像?', options: ['everyone', 'contacts', 'nobody'], exception: '从不分享给' },
      bio_visibility: { title: '个人简介', question: '谁可以看到我的个人简介?', options: ['everyone', 'contacts', 'nobody'], exception: '从不分享给' },
      forward_link_visibility: { title: '转发消息', question: '转发我的消息时，谁可以链接至我的账号?', options: ['everyone', 'contacts', 'nobody'], exception: '从不分享给' },
      who_can_add_me_to_groups: { title: '邀请', question: '谁可以邀请我?', options: ['everyone', 'contacts', 'nobody'], exception: '始终允许' },
      birthday_visibility: { title: 'Birthday', question: 'Who can see my birthday?', options: ['everyone', 'contacts', 'nobody'], exception: '从不分享给' },
      gifts_visibility: { title: 'Gifts', question: 'Who can send me gifts?', options: ['everyone', 'contacts', 'nobody'], exception: '从不分享给' },
      saved_music_visibility: { title: 'Saved Music', question: 'Who can see my saved music?', options: ['everyone', 'contacts', 'nobody'], exception: '从不分享给' },
      who_can_send_messages: { title: '消息', question: '谁可以给我发消息?', options: ['everyone', 'contacts'], exception: '始终允许' },
      who_can_voice_video_call: { title: '语音和视频', question: '谁可以给我打电话?', options: ['everyone', 'contacts'], exception: '始终允许' }
    };

    function csrfToken() {
      return typeof getCookie === 'function' ? (getCookie('csrftoken') || '') : '';
    }

    function toast(text) {
      if (window.showToast) {
        window.showToast(text);
        return;
      }
      const el = document.getElementById('privacy-toast');
      if (!el) return;
      el.textContent = text;
      el.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.classList.remove('is-visible'); }, 1800);
    }

    function visibilityLabel(value) {
      if (value === 'everyone') return '所有人';
      if (value === 'contacts') return '我的联系人';
      if (value === 'nobody') return '无';
      return '未设置';
    }

    function boolLabel(value) {
      return value ? '开启' : '关闭';
    }

    function autoDeleteLabel(days) {
      const value = Number(days || 0);
      if (value === 0) return '关闭';
      if (value === 1) return '1 天';
      if (value === 7) return '7 天';
      if (value === 30) return '30 天';
      return value + ' 天';
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function setSwitch(field, value) {
      const el = document.getElementById('privacy-switch-' + field);
      if (el) el.classList.toggle('is-on', Boolean(value));
    }

    function applyPrivacySettings(settings) {
      privacySettings = settings || {};
      Object.keys(DETAIL_CONFIG).forEach(function(field) {
        setText('privacy-summary-' + field, visibilityLabel(privacySettings[field]));
      });
      setText('privacy-summary-auto_delete_messages_days', autoDeleteLabel(privacySettings.auto_delete_messages_days));
      setText('privacy-summary-login_email', privacySettings.login_email || '未设置');
      setText('privacy-summary-passcode_lock_enabled', boolLabel(privacySettings.passcode_lock_enabled));
      setText('privacy-summary-two_step_verification_enabled', boolLabel(privacySettings.two_step_verification_enabled));
      setText('privacy-summary-passkey_enabled', privacySettings.passkey_enabled ? '1 个通行密钥' : '0 个通行密钥');
      ['passcode_lock_enabled', 'two_step_verification_enabled', 'passkey_enabled', 'sensitive_content_filter'].forEach(function(field) {
        setSwitch(field, privacySettings[field]);
      });
    }

    async function loadPrivacySettings() {
      const response = await fetch(SETTINGS_URL, { headers: { 'X-CSRFToken': csrfToken() } });
      if (!response.ok) throw new Error('privacy settings load failed');
      const data = await response.json();
      applyPrivacySettings(data.settings);
    }

    async function savePrivacy(partial) {
      const response = await fetch(SETTINGS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
        body: JSON.stringify(partial)
      });
      if (!response.ok) throw new Error('privacy settings save failed');
      const data = await response.json();
      applyPrivacySettings(data.settings);
      return data.settings;
    }

    function openDetail(field) {
      detailField = field;
      const config = DETAIL_CONFIG[field];
      if (!config) return;
      document.getElementById('privacy-main-view')?.classList.remove('is-active');
      document.getElementById('privacy-detail-view')?.classList.add('is-active');
      setText('privacy-detail-title', config.title);
      setText('privacy-detail-question', config.question);
      setText('privacy-detail-help', config.help || '这些设置会影响其他用户与您互动时看到的信息。');
      setText('privacy-exception-title', config.exception || '从不分享给');
      document.querySelectorAll('#privacy-detail-view [data-option]').forEach(function(row) {
        const option = row.dataset.option;
        row.hidden = config.options.indexOf(option) === -1;
        row.classList.toggle('is-selected', privacySettings[field] === option);
      });
      if (window.lucide) window.lucide.createIcons();
    }

    function closeDetail() {
      detailField = null;
      document.getElementById('privacy-detail-view')?.classList.remove('is-active');
      document.getElementById('privacy-main-view')?.classList.add('is-active');
    }

    async function loadBlockedUsers() {
      const response = await fetch(BLOCKED_URL, { headers: { 'X-CSRFToken': csrfToken() } });
      if (!response.ok) return;
      const data = await response.json();
      const users = data.blocked_users || [];
      setText('privacy-blocked-count', users.length ? String(users.length) : '无');
      const list = document.getElementById('privacy-blocked-list');
      if (!list) return;
      if (!users.length) {
        list.innerHTML = '<p class="privacy-subtitle" style="text-align:center;padding:24px 0;">无已拉黑用户</p>';
        return;
      }
      list.innerHTML = users.map(function(user) {
        const name = user.nickname || user.username;
        return '<div class="privacy-row" style="grid-template-columns:1fr auto;">'
          + '<span><span class="privacy-title">' + escapeHtml(name) + '</span><span class="privacy-subtitle">@' + escapeHtml(user.username) + '</span></span>'
          + '<button type="button" class="storage-action" data-unblock="' + user.id + '">解除</button>'
          + '</div>';
      }).join('');
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, function(ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    async function unblockUser(userId) {
      const response = await fetch(UNBLOCK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
        body: JSON.stringify({ user_id: Number(userId) })
      });
      if (!response.ok) throw new Error('unblock failed');
      await loadBlockedUsers();
      toast('已解除拉黑');
    }

    function openBlockedModal() {
      const modal = document.getElementById('privacy-blocked-modal');
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
      loadBlockedUsers().catch(function() { toast('加载黑名单失败'); });
    }

    function closeBlockedModal() {
      const modal = document.getElementById('privacy-blocked-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    async function chooseAutoDelete() {
      const raw = prompt('自动删除消息天数：0=关闭，1、7、30 为常用值', String(privacySettings.auto_delete_messages_days || 0));
      if (raw === null) return;
      const days = Number(raw);
      if (![0, 1, 7, 30].includes(days)) {
        toast('请输入 0、1、7 或 30');
        return;
      }
      await savePrivacy({ auto_delete_messages_days: days });
      toast('自动删除设置已保存');
    }

    async function editLoginEmail() {
      const value = prompt('Login Email', privacySettings.login_email || '');
      if (value === null) return;
      await savePrivacy({ login_email: value.trim() });
      toast('登录邮箱已保存');
    }

    function clearPaymentInfo() {
      ['ichat_payment_info', 'ichat_shipping_info', 'ichat_saved_cards'].forEach(function(key) {
        localStorage.removeItem(key);
      });
      toast('付款和配送信息已清除');
    }

    async function deleteCloudDrafts() {
      localStorage.removeItem('ichat_drafts');
      toast('云草稿已清理');
    }

    async function deleteAccount() {
      if (!confirm('确定要注销当前账号吗？此操作不可撤销。')) return;
      const response = await fetch(DELETE_ACCOUNT_URL, { method: 'POST', headers: { 'X-CSRFToken': csrfToken() } });
      if (!response.ok) throw new Error('delete account failed');
      window.location.href = '/login/';
    }

    function bindPrivacyEvents() {
      const root = document.getElementById('privacy-security-settings');
      if (!root || root.dataset.bound === 'true') return;
      root.dataset.bound = 'true';

      root.addEventListener('click', function(event) {
        const detail = event.target.closest('[data-detail]');
        if (detail) {
          openDetail(detail.dataset.detail);
          return;
        }

        const option = event.target.closest('[data-option]');
        if (option && detailField) {
          const value = option.dataset.option;
          savePrivacy({ [detailField]: value })
            .then(function() {
              openDetail(detailField);
              toast('隐私设置已保存');
            })
            .catch(function() { toast('保存失败'); });
          return;
        }

        const toggle = event.target.closest('[data-toggle]');
        if (toggle) {
          const field = toggle.dataset.toggle;
          savePrivacy({ [field]: !Boolean(privacySettings[field]) })
            .then(function() { toast('设置已保存'); })
            .catch(function() { toast('保存失败'); });
          return;
        }

        const action = event.target.closest('[data-action]')?.dataset.action;
        if (!action) return;
        if (action === 'detail-back') closeDetail();
        if (action === 'blocked') openBlockedModal();
        if (action === 'close-blocked') closeBlockedModal();
        if (action === 'auto-delete') chooseAutoDelete().catch(function() { toast('保存失败'); });
        if (action === 'login-email') editLoginEmail().catch(function() { toast('保存失败'); });
        if (action === 'clear-payment-info') clearPaymentInfo();
        if (action === 'delete-cloud-drafts') deleteCloudDrafts();
        if (action === 'exception-placeholder') toast('例外用户列表稍后接入联系人选择器');
      });

      document.getElementById('privacy-blocked-list')?.addEventListener('click', function(event) {
        const button = event.target.closest('[data-unblock]');
        if (button) unblockUser(button.dataset.unblock).catch(function() { toast('解除失败'); });
      });
    }

    window.refreshPrivacySecurity = function() {
      bindPrivacyEvents();
      return Promise.all([
        loadPrivacySettings(),
        loadBlockedUsers()
      ]).then(function() {
        if (window.lucide) window.lucide.createIcons();
      }).catch(function(error) {
        console.warn('[Privacy]', error);
        toast('隐私设置加载失败');
      });
    };

    bindPrivacyEvents();
    window.refreshPrivacySecurity();
  })();
</script>
