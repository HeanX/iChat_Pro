{# settings_home.html - Telegram-style settings home #}
<div class="settings-template-body">

  <section class="settings-template-profile" aria-label="Profile summary">
    <button type="button" class="settings-template-avatar-wrap" data-ichat-onclick="navigateSidebar('settings-profile')" title="Edit Profile" style="background: {% if settings_avatar_url %}transparent{% else %}{{ settings_avatar_color|default:'#5c6bc0' }}{% endif %};">
      {% if settings_avatar_url %}
      <img src="{{ settings_avatar_url }}" alt="{{ settings_display_name }}" class="settings-template-avatar-image">
      {% else %}
      <span class="settings-template-avatar-fallback">{{ settings_initials }}</span>
      {% endif %}
      <span class="settings-template-avatar-overlay">
        <i data-lucide="camera"></i>
      </span>
    </button>
    <h3 class="settings-template-name">{{ settings_display_name }}</h3>
    <p class="settings-template-status {% if settings_is_online %}is-online{% endif %}">{{ settings_presence_label }}</p>
  </section>

  <section class="settings-template-card settings-template-account" aria-label="Account details">
    <div class="settings-template-row is-static">
      <span class="settings-template-row-icon">
        <i data-lucide="phone"></i>
      </span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title">{{ settings_phone_display }}</span>
        <span class="settings-template-row-subtitle" data-i18n="phone_number">Phone Number</span>
      </span>
    </div>
  </section>

  <section class="settings-template-card settings-template-menu" aria-label="Settings categories">
    <button type="button" data-ichat-onclick="navigateSidebar('notifications')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="bell"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="notifications_sounds">Notifications and Sounds</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="navigateSidebar('data-storage')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="database"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="data_and_storage">Data and Storage</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="navigateSidebar('privacy-security')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="lock"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="privacy_and_security">Privacy and Security</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="navigateSidebar('general-settings')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="settings"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="general_settings">General Settings</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="navigateSidebar('chat-folders')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="folder"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="chat_folders">Chat Folders</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="navigateSidebar('stickers-emoji')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="sticker"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="stickers_and_emoji">Stickers and Emoji</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="showToast('Speakers and camera settings coming in Phase 2')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="video"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="speakers_and_camera">Speakers and Camera</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="navigateSidebar('sessions-shortcuts')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="monitor-smartphone"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="devices">Devices</span>
      </span>
      <span class="settings-template-row-value">{{ settings_active_sessions_count }}</span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="navigateSidebar('language')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="languages"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="language">Language / &#35821;&#35328;</span>
      </span>
      <span id="lang-display-val" class="settings-template-row-value" data-i18n="lang_display">English</span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>

    <button type="button" data-ichat-onclick="navigateSidebar('sessions-shortcuts')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="keyboard"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="keyboard_shortcuts">Keyboard Shortcuts</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>
  </section>

  <section class="settings-template-card settings-template-danger" aria-label="Account actions">
    <button type="button" data-ichat-onclick="navigateSidebar('settings')" class="settings-template-row">
      <span class="settings-template-row-icon"><i data-lucide="key-round"></i></span>
      <span class="settings-template-row-main">
        <span class="settings-template-row-title" data-i18n="manage_crypto_keys">Manage Cryptographic Keys</span>
      </span>
      <i data-lucide="chevron-right" class="settings-template-chevron"></i>
    </button>
  </section>

</div>
