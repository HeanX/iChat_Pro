{# birthday_settings.html — Birthday Privacy Settings Subview #}
<div class="profile-edit-view">
  <div class="profile-edit-form">

    <section class="profile-edit-card">
      <div class="profile-edit-section-title" data-i18n="who_can_see_my_birthday">Who can see my birthday</div>

      <div class="birthday-settings-option selected" id="birthday-vis-everyone" data-ichat-onclick="selectBirthdayVis('everyone')">
        <span class="text-sm text-textMain">Everybody</span>
        <span class="telegram-radio"></span>
      </div>

      <div class="birthday-settings-option" id="birthday-vis-contacts" data-ichat-onclick="selectBirthdayVis('contacts')">
        <span class="text-sm text-textMain">My Contacts</span>
        <span class="telegram-radio"></span>
      </div>

      <div class="birthday-settings-option" id="birthday-vis-nobody" data-ichat-onclick="selectBirthdayVis('nobody')">
        <span class="text-sm text-textMain">Nobody</span>
        <span class="telegram-radio"></span>
      </div>
    </section>

    <p class="profile-edit-help">
      You can restrict who can see your birthday with granular precision.
    </p>

    <section class="profile-edit-card">
      <div class="profile-edit-section-title" data-i18n="exceptions">Exceptions</div>

      <div class="profile-edit-row has-chevron" data-ichat-onclick="showToast('Exceptions coming in Phase 3')">
        <i data-lucide="user-minus" class="w-5 h-5 text-textSecondary" aria-hidden="true"></i>
        <div class="flex-1 flex flex-col">
          <span class="text-sm text-textMain" data-i18n="never_allow">Never Allow</span>
          <span class="text-[11px] text-textSecondary" data-i18n="add_users">Add Users</span>
        </div>
        <i data-lucide="chevron-right" aria-hidden="true"></i>
      </div>

      <div class="profile-edit-row has-chevron" data-ichat-onclick="showToast('Exceptions coming in Phase 3')">
        <i data-lucide="user-plus" class="w-5 h-5 text-textSecondary" aria-hidden="true"></i>
        <div class="flex-1 flex flex-col">
          <span class="text-sm text-textMain" data-i18n="always_allow">Always Allow</span>
          <span class="text-[11px] text-textSecondary" data-i18n="add_users">Add Users</span>
        </div>
        <i data-lucide="chevron-right" aria-hidden="true"></i>
      </div>
    </section>

    <p class="profile-edit-help">
      这些设定会覆盖上面的设定。
    </p>

  </div>
</div>

<script nonce="{{ request.csp_nonce }}">
  function selectBirthdayVis(value) {
    // Save to localStorage
    localStorage.setItem('birthday_visibility', value);
    
    // Update active visual state
    ['everyone', 'contacts', 'nobody'].forEach(function(val) {
      var el = document.getElementById('birthday-vis-' + val);
      if (el) {
        el.classList.toggle('selected', val === value);
      }
    });
    
    showToast(currentLanguage === 'zh' ? '设置已更新' : 'Privacy setting updated');
  }

  // Load saved setting on init
  (function initBirthdayVis() {
    var saved = localStorage.getItem('birthday_visibility') || 'contacts';
    ['everyone', 'contacts', 'nobody'].forEach(function(val) {
      var el = document.getElementById('birthday-vis-' + val);
      if (el) {
        el.classList.toggle('selected', val === saved);
      }
    });
  })();
</script>
