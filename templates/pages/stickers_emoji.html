{# stickers_emoji.html - Telegram-style Stickers & Emoji settings #}
<div class="stickers-settings-view">

  <!-- Section 1: Quick Reactions & Playback -->
  <section class="stickers-card">
    <!-- Quick Reactions row -->
    <button type="button" class="stickers-row stickers-row--link" onclick="showToast('快速回应设置即将推出')">

      <span class="stickers-row-label">快速回应</span>

    </button>

    <button type="button" class="stickers-row stickers-row--link" onclick="showToast('推荐表情设置即将推出')">

    </button>

      <span class="stickers-row-icon"><i data-lucide="repeat-2"></i></span>
      <span class="stickers-row-label">循环播放动态贴纸</span>
      <input type="checkbox" id="sticker-loop" checked>
      <span class="stickers-switch"></span>
    </label>
  </section>

  <p class="stickers-hint">动态贴纸将在聊天中重复循环。</p>

  <!-- Section 2: Emoji -->
  <section class="stickers-card">
    <h3 class="stickers-section-header">emoji</h3>

    <label class="stickers-row">
      <span class="stickers-row-icon"><i data-lucide="lightbulb"></i></span>
      <span class="stickers-row-label">推荐的表情</span>
      <input type="checkbox" id="sticker-suggest-emoji" checked>
      <span class="stickers-switch"></span>
    </label>
    <div class="stickers-divider"></div>

    <label class="stickers-row">
      <span class="stickers-row-icon"><i data-lucide="smile"></i></span>
      <span class="stickers-row-label">大号表情</span>
      <input type="checkbox" id="sticker-large-emoji" checked>
      <span class="stickers-switch"></span>
    </label>
  </section>

  <!-- Section 3: Sticker pack order -->
  <section class="stickers-card">
    <h3 class="stickers-section-header">贴纸包动态顺序</h3>

    <label class="stickers-row">
      <span class="stickers-row-icon"><i data-lucide="layout-grid"></i></span>
      <span class="stickers-row-label">贴纸包动态顺序</span>
      <input type="checkbox" id="sticker-dynamic-order" checked>
      <span class="stickers-switch"></span>
    </label>
  </section>

  <p class="stickers-hint">将最近使用的贴纸包自动置于前列。</p>

  <section class="stickers-card">
    <h3 class="stickers-section-header">表情</h3>

    <button type="button" class="stickers-row stickers-row--pack" onclick="showToast('贴纸包管理即将推出')">

        <span class="stickers-pack-name">Hot Cherry</span>
        <span class="stickers-pack-count">34 张表情</span>
      </span>
      <span class="stickers-pack-handle">
        <i data-lucide="grip-vertical"></i>
      </span>
    </button>

    <div class="stickers-divider"></div>

    <button type="button" class="stickers-row stickers-row--pack" onclick="showToast('贴纸包管理即将推出')">
      <span class="stickers-pack-icon">🐱</span>
      <span class="stickers-row-main">

        <span class="stickers-pack-count">28 张表情</span>
      </span>
      <span class="stickers-pack-handle">
        <i data-lucide="grip-vertical"></i>
      </span>
    </button>

    <div class="stickers-divider"></div>

    <button type="button" class="stickers-row stickers-row--pack" onclick="showToast('贴纸包管理即将推出')">
      <span class="stickers-pack-icon">🐸</span>

      </span>
      <span class="stickers-pack-handle">
        <i data-lucide="grip-vertical"></i>
      </span>
    </button>
