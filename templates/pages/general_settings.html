<div id="general-settings-root" class="telegram-general">
  <style>
    .telegram-general {
      --tg-blue: #3390ec;
      --tg-card: #fff;
      --tg-panel: #f4f4f5;
      --tg-muted: #707579;
      --tg-line: rgba(0, 0, 0, .07);
      min-height: 100%;
      padding: 14px 18px 26px;
      background: var(--tg-panel);
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .telegram-general .general-card {
      margin-bottom: 16px;
      padding: 18px 22px;
      border-radius: 24px;
      background: var(--tg-card);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .08);
    }

    .telegram-general .general-section-title {
      margin: 0 0 16px;
      color: var(--tg-blue);
      font-size: 18px;
      font-weight: 650;
    }

    .telegram-general .general-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 56px;
      gap: 12px;
      color: #111;
      font-size: 18px;
      line-height: 1.25;
    }

    .telegram-general .general-row.compact {
      grid-template-columns: minmax(0, 1fr) auto;
      min-height: 42px;
    }

    .telegram-general .general-row + .general-row {
      border-top: 1px solid var(--tg-line);
    }

    .telegram-general button.general-row {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .telegram-general .general-icon {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      color: var(--tg-muted);
    }

    .telegram-general .general-icon svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    .telegram-general .general-value {
      color: var(--tg-muted);
      font-size: 18px;
    }

    .telegram-general .general-range {
      width: 100%;
      margin: 10px 0 18px;
      accent-color: var(--tg-blue);
    }

    .telegram-general .wallpaper-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 4px 0 18px;
    }

    .telegram-general .wallpaper-preview {
      position: relative;
      height: 92px;
      overflow: hidden;
      border: 0;
      border-radius: 16px;
      background:
        radial-gradient(circle at 22px 20px, rgba(255,255,255,.5) 0 12px, transparent 13px),
        linear-gradient(135deg, #a9cf89, #76b47d);
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
    }

    .telegram-general .wallpaper-preview[data-wallpaper="light"] {
      background: linear-gradient(135deg, #cfe6b0, #8ec48b);
    }

    .telegram-general .wallpaper-preview[data-wallpaper="duck"] {
      background: linear-gradient(135deg, #d5e9aa, #92c982);
    }

    .telegram-general .wallpaper-preview[data-wallpaper="snow"] {
      background: linear-gradient(135deg, #c8e7ff, #98c1ff);
    }

    .telegram-general .wallpaper-preview[data-wallpaper="gem"] {
      background: linear-gradient(135deg, #d8c5ff, #9eddf0);
    }

    .telegram-general .wallpaper-preview::before,
    .telegram-general .wallpaper-preview::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      height: 22px;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
    }

    .telegram-general .wallpaper-preview::before {
      top: 16px;
      left: 28px;
    }

    .telegram-general .wallpaper-preview::after {
      bottom: 18px;
      right: 42px;
    }

    .telegram-general .wallpaper-preview.is-selected {
      outline: 3px solid var(--tg-blue);
      outline-offset: 2px;
    }

    .telegram-general .wallpaper-mark {
      position: absolute;
      left: 12px;
      bottom: 8px;
      font-size: 24px;
      line-height: 1;
    }

    .telegram-general .general-option {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      width: 100%;
      min-height: 54px;
      gap: 12px;
      border: 0;
      background: transparent;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .telegram-general .general-radio {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border: 2px solid #7b858d;
      border-radius: 999px;
      color: transparent;
    }

    .telegram-general .general-option.is-selected .general-radio {
      border-color: var(--tg-blue);
      color: var(--tg-blue);
    }

    .telegram-general .general-option-title {
      display: block;
      color: #111;
      font-size: 18px;
      line-height: 1.2;
    }

    .telegram-general .general-option-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--tg-muted);
      font-size: 16px;
      line-height: 1.2;
    }

    .telegram-general .general-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 120;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(17, 24, 39, .9);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .telegram-general .general-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>

  <section class="general-card">
    <h3 class="general-section-title">设置</h3>
    <div class="general-row compact">
      <span>消息字号</span>
      <span id="general-font-size-label" class="general-value">16</span>
    </div>
    <input id="general-font-size-range" class="general-range" type="range" min="12" max="24" value="16" step="1">
    <button type="button" class="general-row" data-action="wallpaper">
      <span class="general-icon"><i data-lucide="image"></i></span>
      <span>聊天壁纸</span>
      <i data-lucide="chevron-right" style="color: var(--tg-muted);"></i>
    </button>
    <button type="button" class="general-row" data-action="power-saving">
      <span class="general-icon"><i data-lucide="gauge"></i></span>
      <span>省电模式</span>
      <span id="general-power-label" class="general-value">已停用</span>
    </button>
  </section>

  <section class="general-card">
    <h3 class="general-section-title">主题颜色</h3>
    <div class="wallpaper-strip">
      <button type="button" class="wallpaper-preview" data-wallpaper="light" aria-label="Green wallpaper"><span class="wallpaper-mark">⌂</span></button>
      <button type="button" class="wallpaper-preview" data-wallpaper="duck" aria-label="Duck wallpaper"><span class="wallpaper-mark">•</span></button>
      <button type="button" class="wallpaper-preview" data-wallpaper="snow" aria-label="Snow wallpaper"><span class="wallpaper-mark">*</span></button>
      <button type="button" class="wallpaper-preview" data-wallpaper="gem" aria-label="Gem wallpaper"><span class="wallpaper-mark">◇</span></button>
    </div>
    <button type="button" class="general-option" data-theme="light">
      <span class="general-radio"><i data-lucide="circle"></i></span>
      <span class="general-option-title">日光白</span>
    </button>
    <button type="button" class="general-option" data-theme="dark">
      <span class="general-radio"><i data-lucide="circle"></i></span>
      <span class="general-option-title">夜间</span>
    </button>
    <button type="button" class="general-option" data-theme="day">
      <span class="general-radio"><i data-lucide="circle"></i></span>
      <span class="general-option-title">Day</span>
    </button>
    <button type="button" class="general-option" data-theme="night">
      <span class="general-radio"><i data-lucide="circle"></i></span>
      <span class="general-option-title">Dark</span>
    </button>
    <button type="button" class="general-option" data-theme="system">
      <span class="general-radio"><i data-lucide="circle"></i></span>
      <span class="general-option-title">系统默认</span>
    </button>
  </section>

  <section class="general-card">
    <h3 class="general-section-title">时间格式</h3>
    <button type="button" class="general-option" data-time-format="12h">
      <span class="general-radio"><i data-lucide="circle"></i></span>
      <span>
        <span class="general-option-title">12小时制</span>
        <span class="general-option-subtitle">04:39 PM</span>
      </span>
    </button>
    <button type="button" class="general-option" data-time-format="24h">
      <span class="general-radio"><i data-lucide="circle"></i></span>
      <span>
        <span class="general-option-title">24小时制</span>
        <span class="general-option-subtitle">16:39</span>
      </span>
    </button>
  </section>

  <div id="general-toast" class="general-toast"></div>
</div>

<script>
  (function() {
    const DEFAULTS = {
      theme: 'system',
      accent_color: 'blue',
      wallpaper: 'light',
      message_font_size: '16',
      time_format: '24h',
      power_saving: false,
      reduce_motion: false
    };
    const WALLPAPER_COLORS = {
      light: '#d9eeb8',
      duck: '#d1e9a5',
      snow: '#d7ebff',
      gem: '#d8f0f3',
      default: ''
    };
    const ACCENT_COLORS = {
      blue: '#3390ec',
      green: '#22c55e',
      purple: '#8b5cf6',
      red: '#ef4444',
      orange: '#f97316'
    };
    let toastTimer = null;

    function toast(text) {
      if (window.showToast) {
        window.showToast(text);
        return;
      }
      const el = document.getElementById('general-toast');
      if (!el) return;
      el.textContent = text;
      el.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.classList.remove('is-visible'); }, 1800);
    }

    function loadGeneralSettings() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('ichat_general') || '{}'); } catch (error) {}
      return Object.assign({}, DEFAULTS, saved);
    }

    function saveGeneralSettings(partial) {
      const settings = Object.assign({}, loadGeneralSettings(), partial || {});
      localStorage.setItem('ichat_general', JSON.stringify(settings));
      applyGeneralSettingsUI(settings);
      return settings;
    }

    function effectiveTheme(theme) {
      if (theme === 'dark' || theme === 'night') return 'dark';
      if (theme === 'system') {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      return 'light';
    }

    function applyThemeGlobally(theme) {
      const applied = effectiveTheme(theme);
      document.documentElement.setAttribute('data-theme', applied);
      document.documentElement.classList.toggle('dark', applied === 'dark');
      localStorage.setItem('ichat-theme', applied);
    }

    function hexToRgba(hex, alpha) {
      if (!hex || hex.indexOf('#') !== 0) return '';
      const clean = hex.replace('#', '');
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function applyWallpaper(settings) {
      const color = WALLPAPER_COLORS[settings.wallpaper] || '';
      const layout = document.querySelector('.chat-layout');
      if (layout) layout.style.backgroundColor = color;
      if (color) {
        document.documentElement.style.setProperty('--chat-footer-bg', color);
        document.documentElement.style.setProperty('--chat-footer-bg-rgba', hexToRgba(color, .88));
      } else {
        document.documentElement.style.removeProperty('--chat-footer-bg');
        document.documentElement.style.removeProperty('--chat-footer-bg-rgba');
      }
    }

    function applyGeneralSettingsUI(settings) {
      const sizeRange = document.getElementById('general-font-size-range');
      const sizeLabel = document.getElementById('general-font-size-label');
      if (sizeRange) sizeRange.value = settings.message_font_size;
      if (sizeLabel) sizeLabel.textContent = settings.message_font_size;

      document.querySelectorAll('#general-settings-root [data-theme]').forEach(function(button) {
        button.classList.toggle('is-selected', button.dataset.theme === settings.theme);
      });
      document.querySelectorAll('#general-settings-root [data-time-format]').forEach(function(button) {
        button.classList.toggle('is-selected', button.dataset.timeFormat === settings.time_format);
      });
      document.querySelectorAll('#general-settings-root [data-wallpaper]').forEach(function(button) {
        button.classList.toggle('is-selected', button.dataset.wallpaper === settings.wallpaper);
      });

      const powerLabel = document.getElementById('general-power-label');
      if (powerLabel) powerLabel.textContent = settings.power_saving ? '已启用' : '已停用';

      document.documentElement.style.setProperty('--color-primary', ACCENT_COLORS[settings.accent_color] || '#3390ec');
      document.documentElement.style.setProperty('--message-font-size', settings.message_font_size + 'px');
      applyThemeGlobally(settings.theme);
      applyWallpaper(settings);
      if (window.lucide) window.lucide.createIcons();
    }

    function bindGeneralSettings() {
      const root = document.getElementById('general-settings-root');
      if (!root || root.dataset.bound === 'true') return;
      root.dataset.bound = 'true';

      document.getElementById('general-font-size-range')?.addEventListener('input', function(event) {
        saveGeneralSettings({ message_font_size: String(event.target.value) });
      });

      root.addEventListener('click', function(event) {
        const themeButton = event.target.closest('[data-theme]');
        if (themeButton) {
          saveGeneralSettings({ theme: themeButton.dataset.theme });
          toast('主题已更新');
          return;
        }
        const timeButton = event.target.closest('[data-time-format]');
        if (timeButton) {
          saveGeneralSettings({ time_format: timeButton.dataset.timeFormat });
          toast(timeButton.dataset.timeFormat === '12h' ? '12小时制' : '24小时制');
          return;
        }
        const wallpaperButton = event.target.closest('[data-wallpaper]');
        if (wallpaperButton) {
          saveGeneralSettings({ wallpaper: wallpaperButton.dataset.wallpaper });
          toast('聊天壁纸已更新');
          return;
        }
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (action === 'power-saving') {
          const current = loadGeneralSettings();
          saveGeneralSettings({ power_saving: !current.power_saving, reduce_motion: !current.power_saving });
          toast(!current.power_saving ? '省电模式已启用' : '省电模式已停用');
        }
        if (action === 'wallpaper') {
          toast('请选择下方壁纸预览');
        }
      });
    }

    window.refreshGeneralSettings = function() {
      bindGeneralSettings();
      applyGeneralSettingsUI(loadGeneralSettings());
    };

    bindGeneralSettings();
    applyGeneralSettingsUI(loadGeneralSettings());
  })();
</script>
