<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>iChat Pro - 离线</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f6f8; color: #2c3e50;
    }
    .card { text-align: center; max-width: 480px; padding: 40px; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #6b7a8d; line-height: 1.6; margin: 0 0 8px; }
    .origin { font-family: Consolas, monospace; background: #e8edf2; padding: 2px 8px; border-radius: 4px; font-size: 13px; }
    .hint { font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>无法连接到 iChat Pro 服务</h1>
    <p>请检查网络连接后稍候，应用会自动重试。</p>
    <p>服务地址：<span class="origin" id="origin"></span></p>
    <p class="hint" id="hint">恢复连接后本页面会自动跳转，无需手动操作。</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("origin").textContent = params.get("origin") || "";
    const message = params.get("message");
    if (message) document.getElementById("hint").textContent = message;
  </script>
</body>
</html>
