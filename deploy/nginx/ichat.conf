# iChat Pro reverse proxy — TLS terminates here; Daphne stays on loopback.
# Placeholders: __SERVER_NAME__ (e.g. sub.example.com:8443), __DOMAIN__ (bare host),
# __STATIC_ROOT__, __MEDIA_AVATARS__, __TLS_CERT__, __TLS_KEY__, __ACME_WEBROOT__.
#
# Port layout (AWS host also running Xray on TCP/UDP 443):
#   TCP 80    -> ACME HTTP-01 + redirect to HTTPS
#   TCP 8443  -> iChat HTTPS / WSS (443 is reserved for Xray, do not move it)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_WEBROOT__;
        default_type "text/plain";
    }

    location / {
        return 301 https://__SERVER_NAME__$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ichat_ssl:10m;

    # Encrypted upload chunks travel as base64 JSON bodies.
    client_max_body_size 32m;

    access_log /var/log/nginx/ichat.access.log;
    error_log  /var/log/nginx/ichat.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias __STATIC_ROOT__/;
        expires 7d;
        access_log off;
    }

    # Avatars are public by policy; encrypted upload chunks are NOT served
    # here — downloads must go through the authenticated /api/files/ views.
    location /media/avatars/ {
        alias __MEDIA_AVATARS__/;
        expires 1d;
        access_log off;
    }

    location = /media/uploads/ {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket upgrade (must stay ahead of the idle heartbeat interval)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
