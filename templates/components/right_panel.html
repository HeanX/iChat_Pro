<!-- right_panel.html - Right side details panel for iChat Pro -->
<div id="right-panel" class="details-panel collapsed chat-details-panel flex flex-col h-full bg-bgSidebar border-l border-borderColor w-[320px] md:w-[380px] flex-shrink-0 select-none z-30 max-lg:fixed max-lg:inset-y-0 max-lg:right-0 max-lg:z-50 max-lg:shadow-2xl">

  <header class="chat-details-header">
    <h3 id="right-panel-title" class="chat-details-title" data-i18n="chat_info_title">聊天信息</h3>
    <button onclick="window.toggleRightPanel()" class="chat-details-close" title="Close Panel" data-i18n-title="close_panel">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
  </header>

  <div class="chat-details-scroll custom-scrollbar">
    <section class="chat-details-hero">
      <div id="details-avatar" class="chat-details-avatar">--</div>
      <div class="chat-details-heading">
        <h4 id="details-name">Select a chat</h4>
        <span id="details-status">Waiting for conversation</span>
      </div>
    </section>

    <section id="right-panel-summary-card" class="chat-details-card">
      <div id="right-panel-username-row" class="chat-details-info-row">
        <i data-lucide="at-sign"></i>
        <div class="chat-details-info-main">
          <div id="right-panel-username" class="chat-details-info-value">--</div>
          <div id="right-panel-username-label" class="chat-details-info-label">用户名</div>
        </div>
        <button id="right-panel-qr-btn" class="chat-details-icon-btn" type="button" title="QR">
          <i data-lucide="qr-code"></i>
        </button>
      </div>

      <div id="right-panel-bio-row" class="chat-details-info-row">
        <i data-lucide="info"></i>
        <div class="chat-details-info-main">
          <div id="right-panel-bio" class="chat-details-info-value">--</div>
          <div id="right-panel-bio-label" class="chat-details-info-label">个人简介</div>
        </div>
      </div>

      <div id="right-panel-email-row" class="chat-details-info-row hidden">
        <i data-lucide="mail"></i>
        <div class="chat-details-info-main">
          <div id="right-panel-email" class="chat-details-info-value">--</div>
          <div class="chat-details-info-label">邮箱</div>
        </div>
      </div>

      <div id="right-panel-phone-row" class="chat-details-info-row hidden">
        <i data-lucide="phone"></i>
        <div class="chat-details-info-main">
          <div id="right-panel-phone" class="chat-details-info-value">--</div>
          <div class="chat-details-info-label">手机号</div>
        </div>
      </div>

      <div id="right-panel-location-row" class="chat-details-info-row hidden">
        <i data-lucide="map-pin"></i>
        <div class="chat-details-info-main">
          <div id="right-panel-location" class="chat-details-info-value">--</div>
          <div class="chat-details-info-label">位置</div>
        </div>
      </div>

      <div id="right-panel-link-row" class="chat-details-info-row hidden">
        <i data-lucide="link"></i>
        <div class="chat-details-info-main">
          <div id="right-panel-link" class="chat-details-info-value">--</div>
          <div class="chat-details-info-label">链接</div>
        </div>
        <button class="chat-details-icon-btn" type="button" title="QR">
          <i data-lucide="qr-code"></i>
        </button>
      </div>

      <div id="right-panel-notify-row" class="chat-details-info-row">
        <i data-lucide="bell"></i>
        <div class="chat-details-info-main">
          <div class="chat-details-info-value">通知</div>
        </div>
        <button id="right-panel-notify-toggle" class="chat-details-switch is-on" type="button" aria-label="Toggle notifications">
          <span></span>
        </button>
      </div>
    </section>

    <section id="right-panel-actions-card" class="chat-details-actions">
      <button id="right-panel-action-search" type="button">
        <i data-lucide="search"></i>
        <span>搜索</span>
      </button>
      <button id="right-panel-action-media" type="button">
        <i data-lucide="image"></i>
        <span>媒体</span>
      </button>
      <button id="right-panel-action-files" type="button">
        <i data-lucide="file-text"></i>
        <span>文件</span>
      </button>
    </section>

    <section id="right-panel-ai-settings-card" class="chat-details-card chat-details-ai-settings hidden">
      <h5 class="chat-details-section-title">模型设置</h5>
      <div class="ai-model-settings-form">
        <label class="ai-model-setting-field" for="ai-model-endpoint">
          <span>请求地址</span>
          <input id="ai-model-endpoint" type="url" spellcheck="false" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions">
        </label>
        <label class="ai-model-setting-field" for="ai-model-api-key">
          <span>API Key</span>
          <input id="ai-model-api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
        </label>
        <label class="ai-model-setting-field" for="ai-model-name">
          <span>模型名称</span>
          <select id="ai-model-name">
            <optgroup label="Qwen">
              <option value="qwen-plus">qwen-plus</option>
              <option value="qwen-turbo">qwen-turbo</option>
              <option value="qwen-max">qwen-max</option>
              <option value="qwen2.5-72b-instruct">qwen2.5-72b-instruct</option>
            </optgroup>
            <optgroup label="Claude">
              <option value="claude-opus-4-8">Claude Opus 4.8</option>
              <option value="claude-opus-4-7">Claude Opus 4.7</option>
              <option value="claude-opus-4-6">Claude Opus 4.6</option>
              <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
              <option value="claude-haiku-4.5-20251001">Claude Haiku 4.5 20251001</option>
            </optgroup>
            <optgroup label="GPT">
              <option value="gpt-5-5">GPT 5.5</option>
              <option value="gpt-5-4">GPT 5.4</option>
              <option value="gpt-5.3-codex-spark">GPT 5.3 codex spark</option>
            </optgroup>
          </select>
        </label>
        <div class="ai-model-settings-actions">
          <button id="ai-model-save-settings" type="button" onclick="saveAiModelSettings()">
            <i data-lucide="save"></i>
            <span>保存设置</span>
          </button>
          <button id="ai-model-clear-settings" type="button" onclick="clearAiModelSettings()">
            <i data-lucide="rotate-ccw"></i>
            <span>清空</span>
          </button>
        </div>
        <p id="ai-model-settings-status" class="ai-model-settings-status">未保存 API Key 时将使用本地 Mock 响应。</p>
      </div>
    </section>

    <section id="right-panel-encryption-card" class="chat-details-card chat-details-encryption">
      <h5 class="chat-details-section-title" data-i18n="encryption_details">加密详情</h5>
      <div class="chat-details-security-box">
        <div class="chat-details-mini-row">
          <span data-i18n="protocol">加密协议</span>
          <strong id="right-panel-protocol">ECDH + HKDF + AES-GCM</strong>
        </div>
        <div class="chat-details-mini-row">
          <span data-i18n="verification">验证状态</span>
          <strong id="right-panel-verification-status" class="chat-details-verification">
            <i data-lucide="shield-check"></i><span data-i18n="verified">已验证</span>
          </strong>
        </div>
        <div id="right-panel-fingerprint-wrapper" class="chat-details-fingerprint-wrap">
          <span data-i18n="cryptographic_fingerprint">加密指纹</span>
          <code id="details-fingerprint">Loading real fingerprint...</code>
          <button onclick="showFingerprintModal()" class="chat-details-verify-btn" title="Verify Fingerprint keys" data-i18n-title="verify_fingerprint_btn">
            <i data-lucide="shield-check"></i>
            <span data-i18n="verify_fingerprint_btn">验证指纹</span>
          </button>
          <button id="right-panel-reset-key-btn" onclick="resetIdentityKeyFromPanel()" class="chat-details-reset-btn" title="Reset local encryption identity">
            <i data-lucide="rotate-cw"></i>
            <span data-i18n="reset_key_btn">重置密钥</span>
          </button>
        </div>
      </div>
    </section>

    <section id="right-panel-group-section" class="chat-details-group hidden">
      <div class="chat-details-tabs" role="tablist">
        <button class="is-active" type="button" data-details-tab="members">成员</button>
        <button type="button" data-details-tab="media">媒体</button>
        <button type="button" data-details-tab="links">链接</button>
      </div>

      <div class="chat-details-card chat-details-members-card">
        <div class="chat-details-card-header">
          <h5 id="right-panel-members-count">群组成员</h5>
          <button id="right-panel-manage-group-btn" onclick="if(activeChatId) navigateToGroupManage(activeChatId)" type="button">
            管理
          </button>
        </div>
        <div id="right-panel-members-list" class="chat-details-members-list">
          <!-- Members dynamically populated by JS -->
        </div>
      </div>
    </section>
  </div>
</div>
